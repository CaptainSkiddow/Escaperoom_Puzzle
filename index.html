<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam Red Pixel Counter</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="container">
        <h1>Webcam Red Pixel Counter</h1>

        <div class="video-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="debug-canvas"></canvas>
        </div>

        <canvas id="canvas"></canvas>

        <div class="stats">
            <div class="stat-row">
                <strong>Red Pixels:</strong> <span id="red-pixel-count">0</span>
            </div>
            <div class="stat-row">
                <strong>Total Pixels:</strong> <span id="total-pixels">0</span>
            </div>
            <div class="stat-row">
                <strong>Percentage Red:</strong> <span id="red-percentage">0%</span>
            </div>
            <div class="stat-row">
                <strong>Blue Pixels:</strong> <span id="blue-pixel-count">0</span>
            </div>
            <div class="stat-row">
                <strong>Percentage Blue:</strong> <span id="blue-percentage">0%</span>
            </div>
            <div class="stat-row">
                <strong>Green Pixels:</strong> <span id="green-pixel-count">0</span>
            </div>
            <div class="stat-row">
                <strong>Percentage Green:</strong> <span id="green-percentage">0%</span>
            </div>
        </div>

        <div id="progress-bar-container" style="width: 100%; background-color: #ddd; height: 20px; margin-top: 10px;">
            <div id="progress-bar" style="width: 0%; height: 100%; background-color: red;"></div>
        </div>

        <div id="blue-progress-bar-container"
            style="width: 100%; background-color: #ddd; height: 20px; margin-top: 10px;">
            <div id="blue-progress-bar" style="width: 0%; height: 100%; background-color: blue;">
            </div>
        </div>
        <div id="green-progress-bar-container"
            style="width: 100%; background-color: #ddd; height: 20px; margin-top: 10px;">
            <div id="green-progress-bar" style="width: 0%; height: 100%; background-color: green;">
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
